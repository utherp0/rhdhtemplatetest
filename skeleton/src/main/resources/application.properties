quarkus.application.name=${{ values.name }}
quarkus.http.port=8080

# Datasource. In Kubernetes the URL/credentials arrive as QUARKUS_DATASOURCE_*
# environment variables from the GitOps manifests; locally `quarkus dev` starts a
# throwaway PostgreSQL via Dev Services.
quarkus.datasource.db-kind=postgresql

# `update` keeps the app usable whether or not the GitOps init job has already
# created the table. Switch to `validate` once the schema is settled.
quarkus.hibernate-orm.schema-management.strategy=update

# Tests use in-memory H2 so `mvn verify` needs no container runtime.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:${{ values.tableName }};DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Readiness reports the datasource connection, which is what the probes care about.
quarkus.datasource.health.enabled=true
