apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: application
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 8080
      targetPort: http
