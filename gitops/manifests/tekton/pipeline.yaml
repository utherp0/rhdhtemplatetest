# Builds the ${{ values.name }} image from source and pushes it to the registry.
#
# The Tasks are defined inline rather than pulled from Tekton Hub or referenced as
# ClusterTasks: ClusterTasks are removed in recent OpenShift Pipelines, and inline Tasks
# keep the pipeline working across Tekton versions with nothing else to install.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ${{ values.name }}-package
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: build
spec:
  description: Clones the application repository and runs `mvn package`.
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      # The buildah image carries git, which saves pulling a separate git image.
      image: quay.io/buildah/stable:v1.43
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        rm -rf repo
        echo "Cloning $(params.git-url) at $(params.git-revision)"
        git clone --depth 1 --branch "$(params.git-revision)" "$(params.git-url)" repo
        # The next step runs as a different UID in the same group, so hand over
        # group write access on everything the clone created.
        chmod -R g+rwX repo
        echo -n "Cloned commit: "
        git -C repo rev-parse --short HEAD

    - name: package
      image: registry.access.redhat.com/ubi9/openjdk-21:latest
      workingDir: $(workspaces.source.path)/repo
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # Keep the Maven cache on the workspace so repeat builds do not re-download.
        mvn -B -ntp package -Dmaven.repo.local=$(workspaces.source.path)/.m2
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ${{ values.name }}-image
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: build
spec:
  description: Builds the container image with buildah and pushes it.
  params:
    - name: image
      type: string
    - name: dockerfile
      type: string
      default: src/main/docker/Dockerfile.jvm
  workspaces:
    - name: source
  results:
    - name: image-digest
      description: Digest of the image that was pushed.
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.43
      workingDir: $(workspaces.source.path)/repo
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        buildah --storage-driver=vfs bud \
          --format=oci \
          -f "$(params.dockerfile)" \
          -t "$(params.image)" .
        buildah --storage-driver=vfs push \
          --digestfile /tmp/image-digest \
          "$(params.image)" "docker://$(params.image)"
        tee "$(results.image-digest.path)" < /tmp/image-digest
      securityContext:
        # What buildah needs to assemble an image without full privilege. On OpenShift
        # this is granted by pipelines-scc -- see the GitOps repository README.
        capabilities:
          add: ["SETFCAP"]
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ${{ values.name }}-build
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: build
spec:
  description: Package the Quarkus application, then build and push its image.
  params:
    - name: git-url
      type: string
      default: ${{ values.gitUrl }}
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      default: ${{ values.imageUrl }}
  workspaces:
    - name: source
  tasks:
    - name: package
      taskRef:
        name: ${{ values.name }}-package
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: source
    - name: image
      runAfter: [package]
      taskRef:
        name: ${{ values.name }}-image
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
  results:
    - name: image-digest
      value: $(tasks.image.results.image-digest)
