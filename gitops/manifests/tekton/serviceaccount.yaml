# The identity the build runs as.
#
# Two things have to be granted to it out of band, because neither belongs in Git:
#
#   # 1. permission for buildah to build images
#   oc adm policy add-scc-to-user pipelines-scc -z ${{ values.name }}-build -n ${{ values.namespace }}
#
#   # 2. credentials to push the image (and to clone, if the repo is private)
#   oc create secret docker-registry ${{ values.name }}-registry \
#       --docker-server=${{ values.imageRegistry }} \
#       --docker-username=<user> --docker-password=<token> -n ${{ values.namespace }}
#   oc secrets link ${{ values.name }}-build ${{ values.name }}-registry -n ${{ values.namespace }}
#
# The secrets are deliberately not listed under `secrets:` here: Tekton fails the build
# pod if a listed secret is missing, and `oc secrets link` adds them to this list anyway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.name }}-build
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: build
