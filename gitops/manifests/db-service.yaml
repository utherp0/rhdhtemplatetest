apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}-db
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
