# Demo-grade secret: this is plain text in Git.
# For anything beyond a demo, replace it with a Sealed Secret, an External Secrets
# ExternalSecret, or an ArgoCD Vault Plugin reference, and delete this file.
apiVersion: v1
kind: Secret
metadata:
  name: ${{ values.name }}-db
  labels:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  database-name: ${{ values.dbName }}
  database-user: ${{ values.dbUser }}
  database-password: ${{ values.dbPassword }}
